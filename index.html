yIsInB1cnBvc2UiOiJhbnkifV19"><style id="appcss">
:root{--bg:#000;--fg:#fff;--pill:#2e2e2e;--mute:#8a8a8a;--line:#3a3a3a;--sheet:#161616;--acc:#ffdd1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;background:#000}html.splashing,html.splashing body{overflow:hidden!important;height:100%!important}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif;scroll-padding-top:env(safe-area-inset-top,0px);user-select:none;-webkit-user-select:none}
body{min-height:100%;max-width:560px;margin:0 auto;padding:0 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:20px}
h1{font-size:24px;font-weight:400;margin:0;line-height:1.2}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.menu{width:48px;height:48px;display:grid;place-items:center;margin-right:-10px}
.menu i{display:block;width:22px;height:2px;background:#fff;margin:3px 0}
.subbar{margin:8px 0 18px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
body.home .subbar{display:none!important}
.bpm{margin:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;min-height:34px;max-width:100%}
.bpm.on{border-color:var(--acc);color:var(--acc)}
.aud-btn{color:#cfcfcf}
.aud-btn.has{border-color:#555;color:#fff;background:#161616}
.aud-btn svg{width:14px;height:14px;flex:none;opacity:.85}
.aud-btn .aud-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:165px}
.aud-btn .aud-tag{font-size:12px;color:var(--acc);font-weight:700;flex:none}
body.has-pl{padding-bottom:156px}
body.has-pl #toast{bottom:calc(82px + env(safe-area-inset-bottom,0px))}
#list{font-size:clamp(17px,5.3vw,22px)}
.row{display:flex;flex-wrap:nowrap;align-items:center;gap:.2em;min-height:2.2em;padding:.14em 0;font-weight:700;transition:opacity .15s}
.row>*{flex:none}
.wrap .row{flex-wrap:wrap}
.play .row{opacity:.3}.play .row.cur{opacity:1}
.row.cur{background:linear-gradient(90deg,#1b1b1b,transparent);border-radius:99px 0 0 99px;margin-left:-8px;padding-left:8px}
.b{height:1.9em;min-width:1.9em;padding:0 .6em;border-radius:99px;display:grid;place-items:center;background:#555;white-space:nowrap}
.b.note{font-size:1.5em;height:1.267em;width:1.933em;padding:0;border-radius:0;clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 0,0 50%,18% 100%,82% 100%);background:#0a9a3a;line-height:1}
.b.note{clip-path:polygon(22% 0,78% 0,100% 50%,78% 100%,22% 100%,0 50%)}
.c{height:1.9em;min-width:1.9em;padding:0 .62em;border-radius:99px;background:var(--pill);display:grid;place-items:center}
.c:active{background:#555}
.play .c{background:#3a3a3a}
.r{height:1.9em;padding:0 .4em;border:2px solid var(--line);border-radius:.3em;display:grid;place-items:center;margin-left:.1em;min-width:2em}
.p{display:inline-flex;align-items:center;gap:.2em;margin-left:.3em;font-size:1em}
.p svg{width:1.5em;height:1.5em}
.p{background:none}
.b.nb{background:transparent!important;color:#5a5a5a;font-weight:400;min-width:2.2em;padding:0}
.adds{display:flex;gap:8px}.adds .add{flex:1;padding:0 6px;font-size:15px}
.row,.row *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#ins{position:fixed;height:3px;background:#fff;border-radius:2px;z-index:9;display:none;pointer-events:none}
.row.ph{opacity:.25}
.row.ghost{background:#262626;box-shadow:0 8px 24px #000c;border-radius:14px;transform:scale(1.03);z-index:9}
#dz.top{top:calc(32px + env(safe-area-inset-top,0px));bottom:auto}
.row.flash{background:#1f3a22;border-radius:14px}
.row.lift{background:#222;box-shadow:0 6px 18px #000a;border-radius:14px;transform:scale(1.02);position:relative;z-index:3}
#dz{position:fixed;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;height:66px;border-radius:99px;border:2px dashed #888;background:#2a2a2a;display:none;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px;z-index:8;transition:background .15s,border-color .15s,color .15s,transform .15s}
#dz svg{width:22px;height:22px;flex:none}
#dz.on{background:#fff;color:#000;border-style:solid}
#dz.del{border:1.5px dashed #ff4d4d;background:rgba(38,14,14,.96);color:#ff6b6b;font-weight:500}
#dz.del.on{background:#e02828;border:1.5px solid #ff5c5c;color:#fff;transform:scale(1.02)}
body.dragging #dz{display:flex}
.prow.ghost.over-del{opacity:.6;transform:scale(.95);transition:opacity .12s,transform .12s}
#toast{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;z-index:10;background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 24px #000c;font-size:15px}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e8e8e8}
#toast button{flex:none;padding:8px 14px;border-radius:99px;background:#fff;color:#000;font-weight:700;font-size:14px}
.hb{display:flex;align-items:center}.hb .menu:first-child{margin-right:0}
.map-l{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .6em}
.row{break-inside:avoid}
.row.mrow{display:inline-flex;min-height:0;padding:0;gap:.15em}
body.v-c,body.v-m{padding-bottom:20px}body.v-c .adds,body.v-m .adds{display:none}
.pv{font-size:19px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-weight:700;margin-bottom:14px}
.pv .gh{font-size:15px;display:grid}
.c.cs{background:#fff;color:#000}
.gh{height:1.9em;min-width:1.9em;padding:0 .5em;border:2px dashed #3d3d3d;color:#7a7a7a;border-radius:99px;display:grid;place-items:center;font-size:.8em;font-weight:700}
.gh.gx{border-radius:.3em}
.gp svg{width:1.4em;height:1.4em;opacity:.5}
.ng .gh{display:none}.play .list .gh{display:none}
h1{cursor:pointer}
.add{margin:14px 0;height:52px;width:100%;border:2px dashed var(--line);border-radius:99px;color:var(--mute)}
.play .add{display:none}
#pl{position:fixed;left:0;right:0;bottom:0;z-index:4;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#121212;border-top:1px solid var(--line)}
#pl input{flex:1;width:auto;min-height:32px;padding:0;background:none;border-radius:0;accent-color:#fff}
#pl span{font-size:14px;color:var(--mute);min-width:38px}
#bd{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
#bd.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s;z-index:6;max-height:86%;overflow:auto}
#sh.on{transform:none}
.h{font-size:13px;color:var(--mute);margin:14px 0 8px}.h:first-child{margin-top:0}
.g{display:flex;flex-wrap:wrap;gap:8px}
.k{min-height:46px;min-width:46px;padding:0 16px;border-radius:99px;background:#2a2a2a;font-weight:700;font-size:17px;display:grid;place-items:center}
.k.sel{background:#fff;color:#000}
.k.dng{color:#ff6b6b}
.k.tp{min-width:76px;min-height:52px;font-size:18px}
.k.tp.note{border-radius:0;clip-path:polygon(22% 0,78% 0,100% 50%,78% 100%,22% 100%,0 50%);min-width:92px;font-size:30px}
.tpw{display:inline-flex}
.tpw.on{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.big{font-size:34px;font-weight:700;margin-bottom:6px}
.ci{font-size:26px;font-weight:700}
.st{display:flex;align-items:center;gap:12px}
.st b{min-width:96px;text-align:center;font-size:18px;border:2px solid var(--line);border-radius:.3em;padding:9px 12px}
textarea{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;font:inherit;width:100%;min-height:170px;background:#2a2a2a;border:0;border-radius:18px;color:#fff;padding:14px;font-size:16px}
input{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;font:inherit;width:100%;min-height:48px;background:#2a2a2a;border:0;border-radius:99px;color:#fff;padding:0 20px;font-size:17px}
.sw{display:flex;border-radius:99px;overflow:hidden;background:#2a2a2a}
.sw button{flex:1;min-height:48px;font-weight:700}
.sw .sel{background:#fff;color:#000}

/* Стили для текстового режима */
.text-view { font-size: clamp(17px,5.3vw,22px); padding-top: 10px; max-width: 100%; overflow-x: hidden; user-select: text; -webkit-user-select: text; }
.text-view .lyric-line { font-family: Roboto, system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #e0e0e0; margin-top: 2px; word-wrap: break-word; }
body.play .text-view { opacity: 1; }

/* Прелоудер и плавное появление главного экрана */
#splash{position:fixed;top:-2px;left:-2px;right:-2px;bottom:-2px;width:calc(100vw + 4px);height:calc(100lvh + 4px);min-height:100vh;z-index:99;background:#000;overflow:hidden;display:grid;place-items:center;opacity:1;transition:opacity .38s ease-out;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
.sp-lock{--u:min(0.95px,0.26vw);display:flex;align-items:center;gap:calc(17.45 * var(--u));transform:translateY(0)}
.sp-mark{width:calc(36.38 * var(--u));height:calc(36 * var(--u));flex:none;overflow:visible;opacity:0;transform:translateX(calc(117.31 * var(--u))) scale(.88);animation:spMark .82s cubic-bezier(.22,1,.36,1) .04s forwards;will-change:transform,opacity}
.sp-spin{transform:rotate(-17.43deg);animation:spSpin .34s cubic-bezier(.25,1.08,.36,1) .20s forwards;will-change:transform}
.sp-word-clip{overflow:hidden;clip-path:inset(0);width:calc(217.17 * var(--u));height:calc(36 * var(--u));flex:none}
.sp-word{width:100%;height:100%;display:block;opacity:0;transform:translateX(-102%);animation:spWord .44s cubic-bezier(.22,1,.36,1) .42s forwards;will-change:transform,opacity}
@keyframes spMark{0%{opacity:0;transform:translateX(calc(117.31 * var(--u))) scale(.88)}24%{opacity:1;transform:translateX(calc(117.31 * var(--u))) scale(1)}46%{opacity:1;transform:translateX(calc(117.31 * var(--u))) scale(1)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes spSpin{0%{transform:rotate(-17.43deg)}100%{transform:rotate(0deg)}}
@keyframes spWord{0%{opacity:0;transform:translateX(-102%)}28%{opacity:1}100%{opacity:1;transform:translateX(0)}}
body.home.revealing header{opacity:0;transform:translateY(6px);transition:opacity .36s ease-out,transform .36s ease-out}
body.home.revealing .prog-h{opacity:0;transform:translateY(6px);transition:opacity .36s ease-out .06s,transform .36s ease-out .06s}
body.home.revealing .prow{opacity:0;transform:translateY(8px);transition:opacity .34s ease-out var(--d,0ms),transform .34s ease-out var(--d,0ms)}
body.home.shown header,body.home.shown .prog-h,body.home.shown .prow{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.sp-mark,.sp-spin,.sp-word{animation:none!important;opacity:1!important;transform:none!important}body.home.revealing header,body.home.revealing .prog-h,body.home.revealing .prow{opacity:1!important;transform:none!important;transition:none!important}}

/* Главный экран (Список программы) и навигация */
header{gap:8px}
.hl{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.back{width:44px;height:44px;margin-left:-12px;display:grid;place-items:center;flex:none;border-radius:99px}
.back:active{background:#1f1f1f}
.brand{display:flex;align-items:center;flex:none}
.brand-svg{height:24px;width:auto;display:block}
.hb{gap:4px;flex:none}
.plus-btn{width:44px;height:44px;border-radius:99px;border:1px solid #2b2b2b;display:grid;place-items:center;margin-right:2px}
.plus-btn:active{background:#1f1f1f}
body.home .song-only{display:none!important}
body:not(.home) .home-only{display:none!important}
body.home #bpm,body.home .adds{display:none!important}
.prog-h{font-size:13px;color:#787878;margin:26px 0 12px;font-weight:400}
.prog-list{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ptitle{flex:1;min-width:0;height:50px;background:#1c1c1c;border-radius:12px;padding:0 18px;display:flex;align-items:center;font-size:18px;font-weight:400;color:#fff;text-align:left;transition:background .12s}
.ptitle span{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbpm{flex:none;height:50px;min-width:90px;padding:0 14px;border-radius:99px;border:1px solid #282828;display:grid;place-items:center;font-size:13px;font-weight:400;color:#8a8a8a;white-space:nowrap;transition:border-color .12s,color .12s}
.prow:active .ptitle{background:#2c2c2c}
.prow:active .pbpm{border-color:#444;color:#bbb}
.prow.ph{opacity:.25}
.prow.ghost{background:#000;box-shadow:0 8px 24px #000c;border-radius:14px;transform:scale(1.02);z-index:9}
.prow.flash .ptitle{background:#1f3a22}

/* Полноэкранный визуальный метроном */
#mvis{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;user-select:none;-webkit-user-select:none}
#mvis.on{display:flex}
#mv-edge{position:fixed;inset:0;pointer-events:none;z-index:31;opacity:0;transition:opacity .2s ease-out}
#mv-edge.b1{box-shadow:inset 0 0 85px rgba(255,221,26,.46),inset 0 0 22px rgba(255,221,26,.32)}
#mv-edge.b2{box-shadow:inset 0 0 68px rgba(255,255,255,.24),inset 0 0 16px rgba(255,255,255,.16)}
.mv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
.mv-song{font-size:16px;color:#8a8a8a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-x{width:44px;height:44px;border-radius:99px;background:#1c1c1c;display:grid;place-items:center;flex:none;font-size:18px;color:#fff}
.mv-x:active{background:#333}
.mv-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;position:relative;z-index:2}
.mv-stage{position:relative;width:min(62vw,248px);aspect-ratio:1;display:grid;place-items:center;cursor:pointer}
.mv-halo{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 70%);opacity:0;transform:scale(.92);pointer-events:none;transition:opacity .22s ease-out,transform .22s ease-out}
.mv-halo.b1{background:radial-gradient(circle,rgba(255,221,26,.34) 0%,transparent 70%)}
.mv-wave{position:absolute;inset:0;border-radius:50%;border:2.5px solid rgba(255,255,255,.7);opacity:0;transform:scale(1);pointer-events:none}
.mv-wave.b1{border-color:#ffdd1a}
.mv-wave.go{transition:transform .36s cubic-bezier(.16,1,.3,1),opacity .36s ease-out;transform:scale(1.58);opacity:0}
.mv-orb{position:relative;width:100%;height:100%;border-radius:50%;background:#141414;border:2.5px solid #333;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .2s cubic-bezier(.22,1,.36,1),background .2s ease-out,border-color .2s ease-out,box-shadow .2s ease-out}
.mv-orb.b1{background:#2a2408;border-color:#ffdd1a;box-shadow:0 0 42px rgba(255,221,26,.35)}
.mv-orb.b2{background:#242424;border-color:#fff;box-shadow:0 0 32px rgba(255,255,255,.22)}
.mv-num{font-size:clamp(54px,16vw,70px);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:#fff}
.mv-sub{font-size:13px;font-weight:700;letter-spacing:.12em;color:#7a7a7a;text-transform:uppercase;margin-top:4px}
.mv-dots{display:flex;align-items:center;gap:10px}
.mv-dot{width:38px;height:38px;border-radius:99px;background:#1a1a1a;border:1.5px solid #2e2e2e;display:grid;place-items:center;font-size:14px;font-weight:700;color:#6e6e6e;transition:background .16s ease-out,border-color .16s ease-out,color .16s ease-out,transform .16s ease-out}
.mv-dot.on1{background:#ffdd1a;border-color:#ffdd1a;color:#000;transform:scale(1.1)}
.mv-dot.on2{background:#fff;border-color:#fff;color:#000;transform:scale(1.06)}
.mv-bot{display:flex;flex-direction:column;gap:10px;z-index:2}
.mv-row{display:flex;gap:8px}
.mv-row .k{flex:1;min-width:0;padding:0 10px;font-size:16px}
.mv-row .k.snd-on{background:#262626;border:1.5px solid #fff;color:#fff}
.mv-row .k.acc-on{border:1.5px solid #ffdd1a;color:#ffdd1a}

.imp-stat{font-size:13px;color:#8a8a8a;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.imp-stat.warn{color:#ffdd1a}
.imp-stat.ok{color:#4cd97b}
.imp-clr{font-size:13px;color:#8a8a8a;text-decoration:underline}
.imp-pills{display:flex;flex-wrap:wrap;gap:5px}
.imp-pill{height:26px;min-width:26px;padding:0 9px;border-radius:99px;font-size:13px;font-weight:700;display:inline-grid;place-items:center}

ать — пусть учится, а то заставят силой.\nУчись всегда, чтоб образованным прилечь потом в могилу,\nА кто невежда и лентяй — тот дуба даст отсталым.\nЯ блюз пою про край наш истощённый, захудалый.\n\n[П]\nМне дела нет до страусов и грифов.\nМне дела нет до позитивов, негативов.\nМне наплевать на Кантовский императив\nИ мне наплевать на рекламные призывы.\nДо лампочки мне солнца зной\nПока мой хвост со мной\nПока мой длинный хвост со мной. Со мной.\n\n[♪ x2]\n\n[Бридж]\nЕсть крылья у одних и ноги у других,\nНо нету смысла о них мусолить тех и тех и этих\nСкоро кондратий пустит на погост.\nВедь главное не крылья и не ноги, а только хвост.\n\n[Соло x2]\n\n[П]\nМне дела нет до страусов и грифов.\nМне дела нет до позитивов, негативов.\nМне наплевать на Кантовский императив\nИ мне наплевать на рекламные призывы.\nДо лампочки мне солнца зной\nПока мой хвост со мной\nПока мой длинный хвост со мной. Со мной.\n\n[♪ x2]\n\n[Конец]", "rows": [{"t": "Ин", "c": ["Em", "G", "Em", "G"], "r": 8, "p": 0}, {"t": "К", "c": ["Em", "G", "Em", "G"], "r": 2, "p": 0}, {"t": "", "c": ["Am", "C", "Am", "C", "Em"], "r": 1, "p": 1}, {"t": "", "c": ["Em", "G", "Em", "G"], "r": 2, "p": 0}, {"t": "", "c": ["Am", "C", "Am", "C", "Em"], "r": 1, "p": 1}, {"t": "П", "c": ["Em", "G", "Em", "G", "Em", "G"], "r": 1, "p": 0}, {"t": "", "c": ["D", "B", "Am", "B", "Em"], "r": 1, "p": 1}, {"t": "♪", "c": ["Em", "G", "Em", "G"], "r": 2, "p": 0}, {"t": "", "c": ["Am", "C", "Am", "C"], "r": 1, "p": 0}, {"t": "", "c": ["Em", "G", "Em", "G"], "r": 1, "p": 0}, {"t": "К", "c": ["Em", "G", "Em", "G"], "r": 2, "p": 0}, {"t": "", "c": ["Am", "C", "Am", "C", "Em"], "r": 1, "p": 1}, {"t": "", "c": ["Em", "G", "Em", "G"], "r": 2, "p": 0}, {"t": "", "c": ["Am", "C", "Am", "C", "Em"], "r": 1, "p": 1}, {"t": "П", "c": ["Em", "G", "Em", "G", "Em", "G"], "r": 1, "p": 0}, {"t": "", "c": ["D", "B", "Am", "B", "Em"], "r": 1, "p": 1}, {"t": "♪", "c": ["Em", "G", "Em", "G"], "r": 2, "p": 0}, {"t": "", "c": ["Am", "C", "Am", "C"], " function detectBpmFromBuffer(ab){
  try{
    const origSr=ab.sampleRate,nCh=ab.numberOfChannels,totalOrig=ab.length;
    const step=Math.max(1,Math.round(origSr/11025)),sr=origSr/step;
    const total=Math.floor(totalOrig/step);
    if(total<sr*3)return null;
    const maxSamp=Math.floor(sr*60);
    const start=total>sr*75?Math.floor(total*0.15):0;
    const len=Math.min(total-start,maxSamp);
    const hop=128,nFrames=Math.floor(len/hop);
    if(nFrames<200)return null;
    const chs=[];for(let c=0;c<nCh;c++)chs.push(ab.getChannelData(c));
    const alpha=1-Math.exp(-2*Math.PI*200/sr);
    const env=new Float32Array(nFrames);
    let lp=0,prevLL=0,prevLA=0;
    for(let f=0;f<nFrames;f++){
      const base=(start+f*hop)*step;
      let eLow=0,eAll=0;
      for(let j=0;j<hop;j++){
        const idx=base+j*step;
        let x=0;for(let c=0;c<nCh;c++)x+=chs[c][idx];
        if(nCh>1)x/=nCh;
        lp+=alpha*(x-lp);
        eLow+=lp*lp;eAll+=x*x;
      }
      const ll=Math.log1p(1000*(eLow/hop)),la=Math.log1p(1000*(eAll/hop));
      env[f]=Math.max(0,ll-prevLL)*1.6+Math.max(0,la-prevLA);
      prevLL=ll;prevLA=la;
    }
    const win=Math.max(4,Math.round(0.35*sr/hop));
    const onset=new Float32Array(nFrames);
    const pref=new Float32Array(nFrames+1);
    for(let i=0;i<nFrames;i++)pref[i+1]=pref[i]+env[i];
    for(let i=0;i<nFrames;i++){
      const a=Math.max(0,i-win),b=Math.min(nFrames,i+win+1);
      onset[i]=Math.max(0,env[i]-(pref[b]-pref[a])/(b-a));
    }
    const fps=sr/hop;
    const minLag=Math.max(2,Math.floor(fps*60/220));
    const maxLag=Math.min(Math.floor(nFrames/2),Math.floor(fps*60/32));
    const acf=new Float32Array(maxLag+2);
    for(let lag=minLag;lag<=maxLag;lag++){
      let s=0;const cnt=nFrames-lag;
      for(let i=0;i<cnt;i++)s+=onset[i]*onset[i+lag];
      acf[lag]=s/cnt;
    }
    const acfAt=lf=>{
      const i0=Math.floor(lf);
      if(i0<minLag||i0+1>maxLag)return 0;
      const fr=lf-i0;
      return acf[i0]*(1-fr)+acf[i0+1]*fr;
    };
    let bestBpm=120,bestScore=-1;
    for(let bpm=65;bpm<=185;bpm++){
      const lag=fps*60/bpm;
      let sc=acfAt(lag)+0.55*acfAt(lag*2)+0.25*acfAt(lag*0.5)+0.20*acfAt(lag*4);
      const p=Math.log2(bpm/118)/0.65;
      sc*=Math.exp(-0.5*p*p);
      if(sc>bestScore){bestScore=sc;bestBpm=bpm}
    }
    return bestBpm;
  }catch(e){return null}
}

async function loadAudioBytes(targetSong,arrayBuf,fileName,saveToDb,showBpmPrompt){
  S.audLoading=true;render();
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const ac=new AC();
    const copyBuf=arrayBuf.slice(0);
    const ab=await ac.decodeAudioData(copyBuf);
    if(song()!==targetSong){try{ac.close()}catch(e){}S.audLoading=false;render();return}
    clearAudioMem();
    S.ac=ac;S.ab=ab;S.asong=targetSong;
    S.audName=fileName.replace(/\.[^.]+$/,'');
    const detBpm=detectBpmFromBuffer(ab);
    S.audBpm=detBpm;
    if(saveToDb)audDbSave(songKey(targetSong),{buf:arrayBuf,name:fileName,bpm:detBpm});
    S.audLoading=false;
    render();
    if(showBpmPrompt&&detBpm){
      if(detBpm!==targetSong.bpm){
        showToast(`Темп аудио: ~${detBpm} bpm`,'Применить',()=>{
          targetSong.bpm=detBpm;
          if(metro)metroOn();
          save();render();
        },8000);
      }else{
        showToast(`Темп аудио совпадает: ${detBpm} bpm`,null,null,2800);
      }
    }
  }catch(err){
    S.audLoading=false;render();
    showToast('Не удалось декодировать аудиофайл',null,null,3500);
  }
}

  const ugMark=/^(Difficulty:|Tuning:|Capo:|Author:|Last edit:|Add to favorites|View in App|Transpose|Listen|PDF|Strumming|Guitar|Ukulele|Piano)$/i;
  if(lines.slice(0,35).some(l=>ugMark.test(l.trim()))){

    });

  const sections=[];let cur=null;
  const ensureSec=(t='К')=>{if(!cur){cur={t,items:[],lyrics:[],hdrRep:1};sections.push(cur)}return cur};

async function pushToGitHub() {
  const ght = $('#gh_token'), ghr = $('#gh_repo');
  const token = (ght ? ght.value : localStorage.getItem('gh_token') || '').trim();
  const repo = (ghr ? ghr.value : localStorage.getItem('gh_repo') || 'abstractlogicus/-hordsmap').trim();
  if (token) localStorage.setItem('gh_token', token);
  if (repo) localStorage.setItem('gh_repo', repo);

  const log = $('#gh_log'), btn = $('#btn_gh_push');
  if(!token || !repo) {
    log.textContent = !token ? 'Введите GitHub Token!' : 'Укажите репозиторий!';
    log.style.color = '#ff6b6b';
    return;
  }
  log.textContent = '⏳ Получение текущей версии...';
  log.style.color = '#ffdd1a';
  btn.style.opacity = '0.5';
  btn.disabled = true;

  try {
    let r = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, {
      cache: 'no-store',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!r.ok) {
      if (r.status === 401) throw new Error('Неверный токен (401)');
      if (r.status === 404) throw new Error('Репозиторий или index.html не найден (404)');
      throw new Error(`Ошибка загрузки (${r.status})`);
    }
    const fileData = await r.json();

    const rawBin = atob(fileData.content.replace(/\s/g, ''));
    const rawBytes = Uint8Array.from(rawBin, c => c.charCodeAt(0));
    const content = new TextDecoder('utf-8').decode(rawBytes);

    const newV = Math.max(SV + 1, Date.now());
    const newData = JSON.stringify({ v: newV, songs: S.lib, cur: Math.max(0, S.lib.indexOf(S.song)) }).replace(/<\/script/gi, '<\\/script');
    const re = /<script type="application\/json" id="seed">[\s\S]*?<\/script>/;
    if (!re.test(content)) throw new Error('В index.html не найден блок seed');
    const newContent = content.replace(re, () => `<script type="application/json" id="seed">${newData}<\/script>`);

    log.textContent = '⏳ Отправка изменений...';
    const outBytes = new TextEncoder().encode(newContent);
    let binStr = '';
    for (let i = 0; i < outBytes.length; i++) binStr += String.fromCharCode(outBytes[i]);
    const b64 = btoa(binStr);

    r = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Авто-обновление сет-листа (v${newV})`,
        content: b64,
        sha: fileData.sha
      })
    });

    if (!r.ok) {
      if (r.status === 401 || r.status === 403) throw new Error(`Нет прав на запись (${r.status}) — проверьте галочку repo у токена`);
      if (r.status === 409) throw new Error('Конфликт версий (409) — нажмите ещё раз');
      throw new Error(`Ошибка сохранения (${r.status})`);
    }

    SV = newV;
    save();
    log.textContent = '✅ Сохранено на GitHub! Сайт обновится через 1–2 мин.';
    log.style.color = '#0a9a3a';
  } catch (err) {
    log.textContent = '❌ ' + err.message;
    log.style.color = '#ff6b6b';
  } finally {
    btn.style.opacity = '1';
    btn.disabled = false;
  }
}

function fit(){
  const l=$('#list'),v=S.view||'full';
  if(S.screen==='home'){document.body.classList.remove('v-c','v-m');l.style.columnCount='';l.style.fontSize='';l.classList.remove('wrap','ng');return}

    const over=()=>Math.max(0,...[...l.querySelectorAll('.row')].map(r=>r.scrollWidth-r.clientWidth));
    for(let k=0;k<10;k++){const o=over();if(o<=0||fs<=min)break;const w=l.children[0]?l.children[0].clientWidth:l.clientWidth;fs=Math.max(min,fs*w/(w+o)-.2);l.style.fontSize=fs+'px'}return fs};
  const hfit=(fs,min)=>{const p=document.getElementById('pl'),top=l.getBoundingClientRect().top+scrollY,avail=innerHeight-top-24-(p&&p.style.display!=='none'?64:0);
    for(let k=0;k<8;k++){if(l.scrollHeight<=avail||fs<=min)break;fs=Math.max(min,fs*avail/l.scrollHeight*.97);l.style.fontSize=fs+'px'}return fs};
