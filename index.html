<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Аккорды</title>
<meta name="mobile-web-app-capable" content="yes"><style id="appcss">
:root{--bg:#000;--fg:#fff;--pill:#2e2e2e;--mute:#8a8a8a;--line:#3a3a3a;--sheet:#161616;--acc:#ffdd1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif;scroll-padding-top:env(safe-area-inset-top,0px);user-select:none;-webkit-user-select:none}
body{min-height:100%;max-width:560px;margin:0 auto;padding:0 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:20px}
h1{font-size:24px;font-weight:400;margin:0;line-height:1.2}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.menu{width:48px;height:48px;display:grid;place-items:center;margin-right:-10px}
.menu i{display:block;width:22px;height:2px;background:#fff;margin:3px 0}
.bpm{margin:8px 0 18px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;min-height:34px}
.bpm.on{border-color:var(--acc);color:var(--acc)}
#list{font-size:clamp(17px,5.3vw,22px)}
.row{display:flex;flex-wrap:nowrap;align-items:center;gap:.2em;min-height:2.2em;padding:.14em 0;font-weight:700;transition:opacity .15s}
.row>*{flex:none}
.wrap .row{flex-wrap:wrap}
.play .row{opacity:.3}.play .row.cur{opacity:1}
.row.cur{background:linear-gradient(90deg,#1b1b1b,transparent);border-radius:99px 0 0 99px;margin-left:-8px;padding-left:8px}
.b{height:1.9em;min-width:1.9em;padding:0 .6em;border-radius:99px;display:grid;place-items:center;background:#555;white-space:nowrap}
.b.note{font-size:1.5em;height:1.267em;width:1.933em;padding:0;border-radius:0;clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 0,0 50%,18% 100%,82% 100%);background:#0a9a3a;line-height:1}
.b.note{clip-path:polygon(22% 0,78% 0,100% 50%,78% 100%,22% 100%,0 50%)}
.c{height:1.9em;min-width:1.9em;padding:0 .62em;border-radius:99px;background:var(--pill);display:grid;place-items:center}
.c:active{background:#555}
.play .c{background:#3a3a3a}
.r{height:1.9em;padding:0 .4em;border:2px solid var(--line);border-radius:.3em;display:grid;place-items:center;margin-left:.1em;min-width:2em}
.p{display:inline-flex;align-items:center;gap:.2em;margin-left:.3em;font-size:1em}
.p svg{width:1.5em;height:1.5em}
.p{background:none}
.b.nb{background:transparent!important;color:#5a5a5a;font-weight:400;min-width:2.2em;padding:0}
.adds{display:flex;gap:8px}.adds .add{flex:1;padding:0 6px;font-size:15px}
.row,.row *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#ins{position:fixed;height:3px;background:#fff;border-radius:2px;z-index:9;display:none;pointer-events:none}
.row.ph{opacity:.25}
.row.ghost{background:#262626;box-shadow:0 8px 24px #000c;border-radius:14px;transform:scale(1.03);z-index:9}
#dz.top{top:calc(32px + env(safe-area-inset-top,0px));bottom:auto}
.row.flash{background:#1f3a22;border-radius:14px}
.row.lift{background:#222;box-shadow:0 6px 18px #000a;border-radius:14px;transform:scale(1.02);position:relative;z-index:3}
#dz{position:fixed;left:16px;right:16px;bottom:calc(32px + env(safe-area-inset-bottom,0px));height:68px;border-radius:99px;border:2px dashed #888;background:#2a2a2a;display:none;place-items:center;font-weight:700;font-size:17px;z-index:8}
#dz.on{background:#fff;color:#000;border-style:solid}
body.dragging #dz{display:grid}
.hb{display:flex;align-items:center}.hb .menu:first-child{margin-right:0}
.map-l{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .6em}
.row{break-inside:avoid}
.row.mrow{display:inline-flex;min-height:0;padding:0;gap:.15em}

.pv{font-size:19px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-weight:700;margin-bottom:14px}
.pv .gh{font-size:15px;display:grid}
.c.cs{background:#fff;color:#000}
.gh{height:1.9em;min-width:1.9em;padding:0 .5em;border:2px dashed #3d3d3d;color:#7a7a7a;border-radius:99px;display:grid;place-items:center;font-size:.8em;font-weight:700}
.gh.gx{border-radius:.3em}
.gp svg{width:1.4em;height:1.4em;opacity:.5}
.ng .gh{display:none}.play .list .gh{display:none}
h1{cursor:pointer}
.add{margin:14px 0;height:52px;width:100%;border:2px dashed var(--line);border-radius:99px;color:var(--mute)}
.play .add{display:none}
#pl{position:fixed;left:0;right:0;bottom:0;z-index:4;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#121212;border-top:1px solid var(--line)}
#pl input{flex:1;width:auto;min-height:32px;padding:0;background:none;border-radius:0;accent-color:#fff}
#pl span{font-size:14px;color:var(--mute);min-width:38px}
#bd{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
#bd.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s;z-index:6;max-height:86%;overflow:auto}
#sh.on{transform:none}
.h{font-size:13px;color:var(--mute);margin:14px 0 8px}.h:first-child{margin-top:0}
.g{display:flex;flex-wrap:wrap;gap:8px}
.k{min-height:46px;min-width:46px;padding:0 16px;border-radius:99px;background:#2a2a2a;font-weight:700;font-size:17px;display:grid;place-items:center}
.k.sel{background:#fff;color:#000}
.k.dng{color:#ff6b6b}
.k.tp{min-width:76px;min-height:52px;font-size:18px}
.k.tp.note{border-radius:0;clip-path:polygon(22% 0,78% 0,100% 50%,78% 100%,22% 100%,0 50%);min-width:92px;font-size:30px}
.tpw{display:inline-flex}
.tpw.on{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.big{font-size:34px;font-weight:700;margin-bottom:6px}
.ci{font-size:26px;font-weight:700}
.st{display:flex;align-items:center;gap:12px}
.st b{min-width:96px;text-align:center;font-size:18px;border:2px solid var(--line);border-radius:.3em;padding:9px 12px}
textarea{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;font:inherit;width:100%;min-height:170px;background:#2a2a2a;border:0;border-radius:18px;color:#fff;padding:14px;font-size:16px}
input{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;font:inherit;width:100%;min-height:48px;background:#2a2a2a;border:0;border-radius:99px;color:#fff;padding:0 20px;font-size:17px}
.sw{display:flex;border-radius:99px;overflow:hidden;background:#2a2a2a}
.sw button{flex:1;min-height:48px;font-weight:700}
.sw .sel{background:#fff;color:#000}

/* Стили для текстового режима */
.text-view { font-size: clamp(17px,5.3vw,22px); padding-top: 10px; max-width: 100%; overflow-x: hidden; user-select: text; -webkit-user-select: text; }
.text-view .lyric-line { font-family: Roboto, system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #e0e0e0; margin-top: 2px; word-wrap: break-word; }
body.play .text-view { opacity: 1; }

const SRC_JS=document.currentScript.textContent,SRC_CSS=document.getElementById('appcss').textContent;
const TYPES=[['Ин','#c4237a'],['К','#1a3cff'],['П','#ff2020'],['Соло','#ffdd1a','#000'],['Бридж','#8a2be2'],['Конец','#ff7a00'],['♪','#0a9a3a'],['','#2a2a2a']];
const ROOTS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B','H'];
const QUAL=[['','maj'],['m','m'],['7','7'],['m7','m7'],['maj7','maj7'],['sus4','sus4']];
const A=['Em','C','Em','C'],B=['Em','D','C#m','C'];
const R=(t,c,r,p)=>({t,c:[...c],r:r||1,p:p||0});
const DEMO=()=>({title:'Матрос (Дети Picasso)',bpm:130,rows:[R('Ин',A,4,2),R('К',A,2),R('♪',A),R('П1',A,2),R('♪',A,2),R('К2',A,2),R('♪',A),R('П2',B,2),R('Соло',B,4),R('П3',B,4),R('♪',A,2),R('Ин',A,2)]});

try{const x=JSON.parse(localStorage.getItem('chords1'));if(x&&x.rows)S.song=x}catch(e){}

if(SEED&&SEED.songs&&SEED.songs.length){S.lib=SEED.songs;S.song=S.lib[Math.min(SEED.cur||0,S.lib.length-1)]}else S.lib=[S.song];
try{const L=JSON.parse(localStorage.getItem('chords2'));if(L&&L.songs&&L.songs.length&&L.base>=SV){S.lib=L.songs;S.song=L.songs[Math.min(L.cur||0,L.songs.length-1)]}}catch(e){}

S.lib.forEach(s=>s.rows.forEach(r=>r.t=norm(r.t)));

function norm(t){const m=/^([КП])\d+$/.exec(t);return m?m[1]:t}
function labelsOf(rows){const c={};return rows.map(r=>{const b=norm(r.t);if(b==='К'||b==='П'){c[b]=(c[b]||0)+1;return b+c[b]}return r.t})}
const tinfo=t=>TYPES.find(x=>x[0]===norm(t))||[t,'#555'];
const pauseSvg='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8v8M14 8v8"/></svg>';

function render(){
  $('#title').textContent=song().title;
  const b=$('#bpm');b.textContent=(metro?'● ':'')+song().bpm+' bpm';b.classList.toggle('on',!!metro);
  document.body.classList.toggle('play',S.mode==='play');
  const v=S.view||'full';
  
  if(v==='text'){
    $('#list').className='text-view';
    document.querySelector('.adds').style.display='none';
    let html='';
    const txt=song().text||'';
    if(txt){
      let tCounters = {};
      txt.split('\n').forEach(l=>{
        const trim=l.trim();
        if(!trim){html+='<div style="height:12px"></div>';return}
        if(trim==='---'){html+='<div style="height:1px; background:var(--line); margin: 16px 0; opacity: 0.5;"></div>';return}
        const m=/^\[(.*?)\]$/.exec(trim);
        if(m){
          let inner = m[1].trim();
          if (inner.toLowerCase() === 'пауза') {
             html += `<div class="row" style="margin: 12px 0 8px;"><button class="p" style="margin:0; pointer-events:none;">${pauseSvg}</button></div>`;
          } else {
             let rep = '';
             const repMatch = /(.*?)\s+(x\d+|\d+x)$/i.exec(inner);
             if(repMatch){
                inner = repMatch[1].trim();
                rep = repMatch[2].toLowerCase();
                if(rep.startsWith('x')) rep = rep.substring(1) + 'x';
             }
             const tName = norm(inner) || inner;
             const ti = tinfo(tName);
             const note = tName === '♪';
             let dispName = tName;
             if (tName === 'К' || tName === 'П') {
                 tCounters[tName] = (tCounters[tName] || 0) + 1;
                 dispName = tName + tCounters[tName];
             }
             html+=`<div class="row" style="margin: 20px 0 8px;"><button class="b${note?' note':''}${tName===''?' nb':''}" style="background:${ti[1]};color:${ti[2]||'#fff'}; pointer-events:none;">${note?'♪':dispName}</button>${rep?`<button class="r" style="pointer-events:none;">${rep}</button>`:''}</div>`;
          }
        }else{
           html += `<div class="lyric-line">${esc(l)}</div>`;
        }
      });
    }else{
      html+='<div class="h">Текста пока нет. Добавьте его через редактор.</div>';
    }
    if(S.mode==='edit') html+=`<div style="margin-top:24px"><button class="add" data-a="edittext" style="display:flex;align-items:center;justify-content:center">Редактировать текст</button></div>`;
    $('#list').innerHTML=html;
    return;
  }
  
  document.querySelector('.adds').style.display='';
  const lab=labelsOf(song().rows);
  const mp=v==='map';$('#list').className='';
  $('#list').innerHTML=song().rows.map((r,i)=>{
    const ti=tinfo(r.t),note=r.t==='♪';
    if(mp&&r.t==='')return '';
    return `<div class="row${S.mode==='play'&&i===S.cur?' cur':''}${S.drag===i?' lift':''}" data-i="${i}">`+
      `<button class="b${note?' note':''}${r.t===''?' nb':''}" data-a="tpick" style="background:${ti[1]};color:${ti[2]||'#fff'}">${note?'♪':lab[i]||'↳'}</button>`+
      (mp?'':r.c.map((c,j)=>`<button class="c" data-a="chord" data-j="${j}">${c}</button>`).join(''))+
      (r.r>1?`<button class="r" data-a="row">${r.r}x</button>`:'')+
      (r.p?`<button class="p" data-a="row">${pauseSvg}</button>`:'')+`</div>`}).join('');
}

function close(){$('#sh').classList.remove('on');$('#bd').classList.remove('on');sel=null}

async function pushToGitHub() {
  const ght = $('#gh_token'), ghr = $('#gh_repo');
  const token = (ght ? ght.value : localStorage.getItem('gh_token') || '').trim();
  const repo = (ghr ? ghr.value : localStorage.getItem('gh_repo') || 'abstractlogicus/-hordsmap').trim();
  if (token) localStorage.setItem('gh_token', token);
  if (repo) localStorage.setItem('gh_repo', repo);

  const log = $('#gh_log'), btn = $('#btn_gh_push');
  if(!token || !repo) {
    log.textContent = !token ? 'Введите GitHub Token!' : 'Укажите репозиторий!';
    log.style.color = '#ff6b6b';
    return;
  }
  log.textContent = '⏳ Получение текущей версии...';
  log.style.color = '#ffdd1a';
  btn.style.opacity = '0.5';
  btn.disabled = true;

  try {
    let r = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, {
      cache: 'no-store',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!r.ok) {
      if (r.status === 401) throw new Error('Неверный токен (401)');
      if (r.status === 404) throw new Error('Репозиторий или index.html не найден (404)');
      throw new Error(`Ошибка загрузки (${r.status})`);
    }
    const fileData = await r.json();

    const rawBin = atob(fileData.content.replace(/\s/g, ''));
    const rawBytes = Uint8Array.from(rawBin, c => c.charCodeAt(0));
    const content = new TextDecoder('utf-8').decode(rawBytes);

    const newV = Math.max(SV + 1, Date.now());
    const newData = JSON.stringify({ v: newV, songs: S.lib, cur: Math.max(0, S.lib.indexOf(S.song)) }).replace(/<\/script/gi, '<\\/script');
    const re = /<script type="application\/json" id="seed">[\s\S]*?<\/script>/;
    if (!re.test(content)) throw new Error('В index.html не найден блок seed');
    const newContent = content.replace(re, () => `<script type="application/json" id="seed">${newData}<\/script>`);

    log.textContent = '⏳ Отправка изменений...';
    const outBytes = new TextEncoder().encode(newContent);
    let binStr = '';
    for (let i = 0; i < outBytes.length; i++) binStr += String.fromCharCode(outBytes[i]);
    const b64 = btoa(binStr);

    r = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Авто-обновление сет-листа (v${newV})`,
        content: b64,
        sha: fileData.sha
      })
    });

    if (!r.ok) {
      if (r.status === 401 || r.status === 403) throw new Error(`Нет прав на запись (${r.status}) — проверьте галочку repo у токена`);
      if (r.status === 409) throw new Error('Конфликт версий (409) — нажмите ещё раз');
      throw new Error(`Ошибка сохранения (${r.status})`);
    }

    SV = newV;
    save();
    log.textContent = '✅ Сохранено на GitHub! Сайт обновится через 1–2 мин.';
    log.style.color = '#0a9a3a';
  } catch (err) {
    log.textContent = '❌ ' + err.message;
    log.style.color = '#ff6b6b';
  } finally {
    btn.style.opacity = '1';
    btn.disabled = false;
  }
}
